# Streamable HTTP deployment of the weather MCP server.
#
# Publishes on the loopback interface only — TLS and the public hostname are the
# reverse proxy's job (1Panel / OpenResty, nginx, Caddy). Authentication is
# Auth0 OAuth; Garmin's /connect users are the authorization source.

services:
  weather-mcp:
    build: .
    image: weather-mcp:local
    container_name: weather-mcp
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # host:container — only the reverse proxy on this machine should reach it.
      - "127.0.0.1:8787:8080"
    volumes:
      # Saved locations, one directory per tenant id.
      - ./data:/data
      # Legacy tenant aliases only; no key material is read by the HTTP runtime.
      - ./config:/config:ro
    networks:
      - default
      - mcp-internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
  mcp-internal:
    external: true
