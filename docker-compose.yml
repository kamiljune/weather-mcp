# Streamable HTTP deployment of the weather MCP server.
#
# Publishes on the loopback interface only — TLS and the public hostname are the
# reverse proxy's job (1Panel / OpenResty, nginx, Caddy). Copy .env.http.example
# to .env and fill in WEATHER_API_KEYS before starting.

services:
  weather-mcp:
    build: .
    image: weather-mcp:local
    container_name: weather-mcp
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # host:container — only the reverse proxy on this machine should reach it.
      - "127.0.0.1:8787:8080"
    volumes:
      # Saved locations, one directory per API key id.
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # If the reverse proxy itself runs in a container (1Panel's OpenResty does)
    # and cannot reach 127.0.0.1 on the host, put both on the same Docker network
    # and proxy to http://weather-mcp:8080 instead. Uncomment below and the
    # matching networks block:
    # networks:
    #   - 1panel-network

# networks:
#   1panel-network:
#     external: true
